<svg viewBox='0 0 720 258' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='Quatro números: 19 por cento dos jovens pediram conselho a um chatbot, 63 por cento não contaram a ninguém, 28 intervenções humanas no ensaio do Therabot, e 0,15 por cento dos usuários semanais do ChatGPT com sinais de ideação suicida. Abaixo: o projeto de lei alcança pessoas, não aplicativos.'>
<text x='20' y='26' text-anchor='start' font-family='Plus Jakarta Sans,sans-serif' font-size='11' font-weight='800' fill='#bcae56' letter-spacing='1.4'>O QUE O PACIENTE JÁ USA</text>
<rect x='20' y='44' width='150' height='96' rx='8' fill='#efe7d3'/><text x='95' y='92' text-anchor='middle' font-family='Plus Jakarta Sans,sans-serif' font-size='26' font-weight='800' fill='#3d411f'>19%</text><text x='95' y='114' text-anchor='middle' font-family='Plus Jakarta Sans,sans-serif' font-size='10.5' fill='#2f2e24'>dos 12 a 21 anos pediram</text><text x='95' y='128' text-anchor='middle' font-family='Plus Jakarta Sans,sans-serif' font-size='10.5' fill='#2f2e24'>conselho a um chatbot</text>
<rect x='190' y='44' width='150' height='96' rx='8' fill='#f7ede7'/><text x='265' y='92' text-anchor='middle' font-family='Plus Jakarta Sans,sans-serif' font-size='26' font-weight='800' fill='#a05a3c'>63%</text><text x='265' y='114' text-anchor='middle' font-family='Plus Jakarta Sans,sans-serif' font-size='10.5' fill='#2f2e24'>desses, não contaram</text><text x='265' y='128' text-anchor='middle' font-family='Plus Jakarta Sans,sans-serif' font-size='10.5' fill='#2f2e24'>a ninguém</text>
<rect x='360' y='44' width='150' height='96' rx='8' fill='#efe7d3'/><text x='435' y='92' text-anchor='middle' font-family='Plus Jakarta Sans,sans-serif' font-size='26' font-weight='800' fill='#3d411f'>28</text><text x='435' y='114' text-anchor='middle' font-family='Plus Jakarta Sans,sans-serif' font-size='10.5' fill='#2f2e24'>intervenções humanas</text><text x='435' y='128' text-anchor='middle' font-family='Plus Jakarta Sans,sans-serif' font-size='10.5' fill='#2f2e24'>em 8 semanas de Therabot</text>
<rect x='530' y='44' width='150' height='96' rx='8' fill='#f7ede7'/><text x='605' y='92' text-anchor='middle' font-family='Plus Jakarta Sans,sans-serif' font-size='26' font-weight='800' fill='#a05a3c'>0,15%</text><text x='605' y='114' text-anchor='middle' font-family='Plus Jakarta Sans,sans-serif' font-size='10.5' fill='#2f2e24'>dos usuários semanais com</text><text x='605' y='128' text-anchor='middle' font-family='Plus Jakarta Sans,sans-serif' font-size='10.5' fill='#2f2e24'>sinais de ideação suicida</text>
<rect x='20' y='160' width='680' height='84' rx='8' fill='#3d411f'/>
<text x='36' y='182' text-anchor='start' font-family='Plus Jakarta Sans,sans-serif' font-size='10.5' font-weight='800' fill='#bcae56' letter-spacing='1.2'>O PL 2.386 ALCANÇA</text>
<text x='200' y='182' text-anchor='start' font-family='Plus Jakarta Sans,sans-serif' font-size='12' fill='#f8f3e6'>o coach, o terapeuta holístico, quem cobra por “psicoterapia” sem registro.</text>
<text x='36' y='222' text-anchor='start' font-family='Plus Jakarta Sans,sans-serif' font-size='10.5' font-weight='800' fill='#bcae56' letter-spacing='1.2'>NÃO ALCANÇA</text>
<text x='200' y='222' text-anchor='start' font-family='Plus Jakarta Sans,sans-serif' font-size='12' font-weight='800' fill='#f8f3e6'>o aplicativo que a tua paciente abre às 2 da manhã.</text>
