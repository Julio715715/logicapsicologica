<svg viewBox='0 0 720 220' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='Três barras: 5.209 domínios com pedido de derrubada, 2.387 bloqueados pela Anatel e 6.401 sites ilegais novos numa semana.'>
<text x='20' y='26' text-anchor='start' font-family='Plus Jakarta Sans,sans-serif' font-size='11' font-weight='800' fill='#bcae56' letter-spacing='1.4'>A OFERTA, EM SITES</text>
<rect x='120' y='48' width='244' height='22' rx='5' fill='#5a5e2e'/>
<text x='110' y='64' text-anchor='end' font-family='Plus Jakarta Sans,sans-serif' font-size='15' font-weight='800' fill='#5a5e2e'>5.209</text>
<text x='372' y='63' text-anchor='start' font-family='Plus Jakarta Sans,sans-serif' font-size='11' fill='#2f2e24'>domínios com pedido de derrubada</text>
<rect x='120' y='88' width='111' height='22' rx='5' fill='#3d411f'/>
<text x='110' y='104' text-anchor='end' font-family='Plus Jakarta Sans,sans-serif' font-size='15' font-weight='800' fill='#3d411f'>2.387</text>
<text x='239' y='103' text-anchor='start' font-family='Plus Jakarta Sans,sans-serif' font-size='11' fill='#2f2e24'>já bloqueados pela Anatel</text>
<rect x='120' y='128' width='300' height='22' rx='5' fill='#a05a3c'/>
<text x='110' y='144' text-anchor='end' font-family='Plus Jakarta Sans,sans-serif' font-size='15' font-weight='800' fill='#a05a3c'>6.401</text>
<text x='428' y='143' text-anchor='start' font-family='Plus Jakarta Sans,sans-serif' font-size='11' fill='#2f2e24'>sites ilegais novos entre 22 e 28 de setembro</text>
<rect x='20' y='172' width='680' height='36' rx='8' fill='#efe7d3'/>
<text x='36' y='195' text-anchor='start' font-family='Plus Jakarta Sans,sans-serif' font-size='10.5' fill='#6c6a55'>Pico: 3.094 endereços novos num só dia, logo depois do anúncio da MP. Dado de oferta (quantos sites), não de demanda (quantos apostam).</text>
</svg>