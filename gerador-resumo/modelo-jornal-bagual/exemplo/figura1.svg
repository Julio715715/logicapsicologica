<svg aria-label="Linha do tempo da MP 1.394: apostas suspensas em 25 de setembro, saque até 5 de outubro, sites fora do ar de 6 a 7, devolução de 9 a 14, Caixa a partir de 14" role="img" viewbox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
<line stroke="#c9c2a8" stroke-width="3" x1="40" x2="680" y1="90" y2="90"></line>
<circle cx="60" cy="90" fill="#a05a3c" r="9"></circle><circle cx="230" cy="90" fill="#43441f" r="9"></circle>
<circle cx="400" cy="90" fill="#43441f" r="9"></circle><circle cx="540" cy="90" fill="#7c8054" r="9"></circle><circle cx="660" cy="90" fill="#7c8054" r="9"></circle>
<text fill="#a05a3c" font-family="Plus Jakarta Sans,sans-serif" font-size="13" font-weight="800" text-anchor="middle" x="60" y="58">25 set</text>
<text fill="#2f2e24" font-family="Plus Jakarta Sans,sans-serif" font-size="11.5" text-anchor="middle" x="60" y="120">MP 1.394 publicada</text>
<text fill="#2f2e24" font-family="Plus Jakarta Sans,sans-serif" font-size="11.5" text-anchor="middle" x="60" y="137">apostas suspensas</text>
<text fill="#43441f" font-family="Plus Jakarta Sans,sans-serif" font-size="13" font-weight="800" text-anchor="middle" x="230" y="58">até 5 out</text>
<text fill="#2f2e24" font-family="Plus Jakarta Sans,sans-serif" font-size="11.5" text-anchor="middle" x="230" y="120">saque voluntário</text>
<text fill="#2f2e24" font-family="Plus Jakarta Sans,sans-serif" font-size="11.5" text-anchor="middle" x="230" y="137">do saldo</text>
<text fill="#43441f" font-family="Plus Jakarta Sans,sans-serif" font-size="13" font-weight="800" text-anchor="middle" x="400" y="58">6 e 7 out</text>
<text fill="#2f2e24" font-family="Plus Jakarta Sans,sans-serif" font-size="11.5" text-anchor="middle" x="400" y="120">sites e apps</text>
<text fill="#2f2e24" font-family="Plus Jakarta Sans,sans-serif" font-size="11.5" text-anchor="middle" x="400" y="137">fora do ar</text>
<text fill="#7c8054" font-family="Plus Jakarta Sans,sans-serif" font-size="13" font-weight="800" text-anchor="middle" x="540" y="58">9 a 14 out</text>
<text fill="#2f2e24" font-family="Plus Jakarta Sans,sans-serif" font-size="11.5" text-anchor="middle" x="540" y="120">devolução</text>
<text fill="#2f2e24" font-family="Plus Jakarta Sans,sans-serif" font-size="11.5" text-anchor="middle" x="540" y="137">pelos bancos</text>
<text fill="#7c8054" font-family="Plus Jakarta Sans,sans-serif" font-size="13" font-weight="800" text-anchor="middle" x="660" y="58">14 out</text>
<text fill="#2f2e24" font-family="Plus Jakarta Sans,sans-serif" font-size="11.5" text-anchor="middle" x="660" y="120">Caixa assume</text>
<text fill="#2f2e24" font-family="Plus Jakarta Sans,sans-serif" font-size="11.5" text-anchor="middle" x="660" y="137">o que faltar</text>
<text fill="#8d876f" font-family="Plus Jakarta Sans,sans-serif" font-size="11" font-style="italic" text-anchor="middle" x="360" y="180">Do objeto disponível 24 horas por dia ao objeto indisponível: doze dias.</text>
</svg>